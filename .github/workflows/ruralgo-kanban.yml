name: Crear Kanban RuralGo
'on':
  workflow_dispatch: null
jobs:
  crear_historias:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
        - id: HU-01
          epic: Gestión de usuarios y acceso
          title: Registrar usuarios
          story: Como administrador, quiero registrar usuarios para que las personas autorizadas puedan utilizar RuralGo según
            su rol.
          criteria: 1. Permitir registrar nombre, correo, contraseña y rol.\n2. Validar los datos obligatorios.\n3. Confirmar
            el registro correctamente.
          priority: P1
          points: 3
          sprint: Actual
        - id: HU-02
          epic: Gestión de usuarios y acceso
          title: Iniciar sesión
          story: Como usuario registrado, quiero iniciar sesión de forma segura para acceder a las funciones de RuralGo según
            mi rol.
          criteria: 1. Validar correo y contraseña.\n2. Mostrar mensaje cuando las credenciales sean incorrectas.\n3. Permitir
            el acceso según el rol.
          priority: P1
          points: 3
          sprint: Actual
        - id: HU-03
          epic: Gestión de usuarios y acceso
          title: Administrar roles
          story: Como administrador, quiero asignar y modificar roles para controlar el acceso a las funciones de RuralGo.
          criteria: 1. Mostrar los roles disponibles.\n2. Permitir asignar un rol a cada usuario.\n3. Aplicar los permisos
            correspondientes.
          priority: P2
          points: 2
          sprint: Actual
        - id: HU-04
          epic: Reservas
          title: Consultar disponibilidad
          story: Como cliente, quiero consultar la disponibilidad de los alojamientos para elegir fechas que estén libres.
          criteria: 1. Permitir seleccionar fecha de entrada y salida.\n2. Mostrar los alojamientos disponibles.\n3. No mostrar
            alojamientos con fechas ocupadas.
          priority: P1
          points: 5
          sprint: Actual
        - id: HU-05
          epic: Reservas
          title: Registrar una reserva
          story: Como administrador, quiero registrar una reserva con los datos del cliente y del alojamiento para evitar
            errores y conflictos de fechas.
          criteria: 1. Registrar cliente, alojamiento y fechas.\n2. Validar que no exista otra reserva para el mismo periodo.\n3.
            Guardar la reserva con su información completa.
          priority: P1
          points: 5
          sprint: Actual
        - id: HU-06
          epic: Reservas
          title: Consultar reservas
          story: Como administrador, quiero consultar las reservas para visualizar clientes, fechas, alojamiento y estado
            de cada reserva.
          criteria: 1. Mostrar las reservas registradas.\n2. Permitir consultar cliente, fechas y alojamiento.\n3. Mostrar
            el estado actualizado de cada reserva.
          priority: P1
          points: 3
          sprint: Siguiente
        - id: HU-07
          epic: Reservas
          title: Gestionar estado de reserva
          story: Como administrador, quiero actualizar el estado de una reserva para mantener controlado su ciclo desde la
            solicitud hasta su finalización.
          criteria: 1. Permitir estados pendiente, confirmada, cancelada y completada.\n2. Guardar cada cambio de estado.\n3.
            Mostrar el estado vigente de la reserva.
          priority: P2
          points: 3
          sprint: Siguiente
        - id: HU-08
          epic: Contratación digital
          title: Generar contrato digital
          story: Como administrador, quiero generar un contrato digital asociado a la reserva para formalizar las condiciones
            de la estadía.
          criteria: 1. Generar el contrato con los datos de la reserva.\n2. Asociarlo al cliente y alojamiento.\n3. Permitir
            consultar el documento generado.
          priority: P1
          points: 5
          sprint: Siguiente
        - id: HU-09
          epic: Contratación digital
          title: Consultar contrato digital
          story: Como cliente, quiero consultar mi contrato digital para conocer las condiciones de la reserva y la estadía.
          criteria: 1. Mostrar el contrato asociado a la reserva.\n2. Permitir consultar sus condiciones.\n3. Restringir el
            acceso a usuarios autorizados.
          priority: P2
          points: 3
          sprint: Siguiente
        - id: HU-10
          epic: Inventario operativo
          title: Registrar inventario
          story: Como personal operativo, quiero registrar los elementos del alojamiento para conocer las cantidades y su
            estado.
          criteria: 1. Registrar elemento, cantidad y estado.\n2. Asociar el inventario al alojamiento.\n3. Guardar la información
            correctamente.
          priority: P1
          points: 5
          sprint: Siguiente
        - id: HU-11
          epic: Inventario operativo
          title: Revisar inventario antes del ingreso
          story: Como personal operativo, quiero revisar el inventario antes del ingreso del huésped para dejar constancia
            del estado inicial del alojamiento.
          criteria: 1. Mostrar el inventario del alojamiento.\n2. Permitir verificar cantidades y estado.\n3. Registrar la
            revisión realizada.
          priority: P1
          points: 3
          sprint: Siguiente
        - id: HU-12
          epic: Inventario operativo
          title: Registrar novedades del inventario
          story: Como personal operativo, quiero registrar daños o elementos faltantes con evidencia para dejar trazabilidad
            de las novedades.
          criteria: 1. Permitir registrar daño o faltante.\n2. Asociar la novedad al inventario y alojamiento.\n3. Permitir
            adjuntar evidencia cuando corresponda.
          priority: P1
          points: 5
          sprint: Siguiente
        - id: HU-13
          epic: Analítica financiera (ERI)
          title: Registrar ingresos
          story: Como administrador, quiero registrar los ingresos generados por las reservas para llevar control de los movimientos
            del alojamiento.
          criteria: 1. Registrar valor y fecha del ingreso.\n2. Asociarlo a la reserva correspondiente.\n3. Permitir consultar
            los ingresos registrados.
          priority: P1
          points: 3
          sprint: Siguiente
        - id: HU-14
          epic: Analítica financiera (ERI)
          title: Registrar gastos
          story: Como administrador, quiero registrar los gastos del alojamiento para conocer los costos relacionados con
            su operación.
          criteria: 1. Registrar concepto, valor y fecha.\n2. Asociar el gasto al alojamiento.\n3. Permitir consultar los
            gastos registrados.
          priority: P1
          points: 3
          sprint: Siguiente
        - id: HU-15
          epic: Analítica financiera (ERI)
          title: Consultar información financiera
          story: Como propietario, quiero consultar los ingresos y gastos por periodo para conocer el resultado de la operación
            y apoyar la toma de decisiones.
          criteria: 1. Permitir seleccionar un periodo.\n2. Mostrar ingresos y gastos del periodo.\n3. Presentar el resultado
            de la operación de forma clara.
          priority: P1
          points: 5
          sprint: Siguiente
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: dcjaramillo98-a11y
      PROJECT_NUMBER: '1'
    steps:
    - name: Crear historia de usuario
      shell: bash
      run: 'set -euo pipefail

        body="$(printf ''%b'' ''${{ matrix.story }}\n\n### Criterios de aceptación\n${{ matrix.criteria }}\n\n**Epopeya:**
        ${{ matrix.epic }}\n**Prioridad:** ${{ matrix.priority }}\n**Puntos de historia:** ${{ matrix.points }}\n**Sprint:**
        ${{ matrix.sprint }}\n**Estado inicial:** Por hacer'')"


        echo "Creando ${{ matrix.id }} - ${{ matrix.title }}"


        gh project item-create "$PROJECT_NUMBER"   --owner "$OWNER"   --title "${{ matrix.title }}"   --body "$body"


        echo "✓ ${{ matrix.id }} - ${{ matrix.title }} creado en el Project #$PROJECT_NUMBER"
